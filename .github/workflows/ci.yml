name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit and slice tests. Fast, and the gate that must stay green on every push.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  # Client-side OT convergence harness: 500 randomized scenarios, no services
  # required, so it is cheap enough to run on every push.
  ot-convergence:
    name: Client OT convergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run client convergence harness
        run: node scripts/test-ot-client.mjs

  # Testcontainers-backed suites: real PostgreSQL, Redis, and Docker-sandboxed
  # execution. ubuntu-latest runners ship a working Docker daemon, so these run
  # on push and pull request alongside the unit tests.
  #
  # If they ever prove flaky on CI — most likely from image pull rate limits or
  # a slow runner tripping a container startup timeout — narrow the triggers on
  # this job to `workflow_dispatch` only and note it here, leaving the `test`
  # and `ot-convergence` jobs as the per-push gate.
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pulled ahead of time so a slow pull inside a test cannot trip a
      # container startup timeout.
      - name: Pre-pull sandbox images
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull python:3.12-slim
          docker pull eclipse-temurin:17-jdk-jammy

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest
          if-no-files-found: ignore

  # Proves the documented Quickstart: the image builds and the stack reports
  # healthy with only APP_JWT_SECRET supplied.
  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          echo "APP_JWT_SECRET=$(openssl rand -base64 48)" > .env
          docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose ps -q app)" 2>/dev/null || echo starting)
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 5
          done
          echo "::error::app container did not become healthy"
          docker compose logs app
          exit 1

      - name: Check the health endpoint
        run: curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'

      - name: Tear down
        if: always()
        run: docker compose down -v
