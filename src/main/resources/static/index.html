<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collaborative Code Editor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="toast" class="toast hidden"></div>

<!-- Auth -->
<section id="view-auth" class="center-view">
  <div class="panel auth-panel">
    <h1>Collaborative<br>Code Editor</h1>
    <p class="sub">Real-time pair programming with server-authoritative
       Operational Transform and Docker-sandboxed execution.</p>
    <label for="auth-email">Email</label>
    <input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="auth-password">Password <span class="hint">(min 8 chars)</span></label>
    <input id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="row">
      <button id="login-btn" class="primary">Sign in</button>
      <button id="register-btn">Create account</button>
    </div>
  </div>
</section>

<!-- Lobby -->
<section id="view-lobby" class="center-view hidden">
  <div class="panel lobby-panel">
    <div class="lobby-head">
      <h2>Sessions</h2>
      <span id="lobby-user" class="chip me"></span>
    </div>
    <div class="row">
      <select id="create-language">
        <option value="PYTHON">Python</option>
        <option value="JAVA">Java</option>
      </select>
      <button id="create-btn" class="primary">New session</button>
    </div>
    <div class="row">
      <input id="join-code" placeholder="Invite code (e.g. K7PQ2MRX)" maxlength="8" spellcheck="false">
      <button id="join-btn">Join</button>
    </div>
    <div class="lobby-head">
      <h3>Your sessions</h3>
      <button id="refresh-btn" class="ghost">Refresh</button>
    </div>
    <ul id="session-list" class="session-list"></ul>
  </div>
</section>

<!-- Editor -->
<section id="view-editor" class="editor-view hidden">
  <header>
    <div class="left">
      <button id="leave-btn" class="ghost">← Leave</button>
      <span class="invite">Invite: <code id="editor-invite"></code></span>
      <button id="copy-invite" class="ghost" title="Copy invite code">⧉</button>
      <span id="editor-language" class="pill lang"></span>
    </div>
    <div id="participants" class="participants"></div>
    <div class="right">
      <span id="revision" class="pill">rev 0</span>
      <span id="conn-status" class="pill warn">connecting…</span>
      <button id="run-btn" class="primary">▶ Run</button>
    </div>
  </header>
  <main>
    <textarea id="editor" spellcheck="false" disabled
      placeholder="Start typing — everyone in the session sees your edits live."></textarea>
    <aside class="output">
      <div class="output-head">
        <span>OUTPUT</span>
        <span id="exec-status" class="exec-status"></span>
      </div>
      <pre id="exec-output"></pre>
    </aside>
  </main>
</section>

<script src="/app.js"></script>
</body>
</html>
